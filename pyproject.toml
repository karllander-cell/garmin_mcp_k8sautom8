[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server to access Garmin data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv==1.0.1",
    "garminconnect==0.2.25",
    "requests==2.32.3",
    "mcp>=1.4.0,<2.0.0",
    "garth==0.5.2",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "anthropic>=0.40,<1.0",
]

[project.scripts]
garmin-mcp = "garmin_mcp:main"
garmin-dashboard = "garmin_mcp.webapp:main"

[tool.uv.sources]
garmin-mcp = { workspace = true }

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "httpx>=0.27",
]
